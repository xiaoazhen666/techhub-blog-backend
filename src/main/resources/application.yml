server:
  port: 8080

spring:
  application:
    name: techhub-blog
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/techhub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# JWT 配置
jwt:
  # 生产环境通过环境变量 JWT_SECRET 注入（至少 32 字节）
  secret: ${JWT_SECRET:TechHubBlogSecretKeyForJwtSigning2026ChangeMe}
  # token 有效期（毫秒），默认 7 天
  expiration: 604800000

logging:
  level:
    com.techhub: info
